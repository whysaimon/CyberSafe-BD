<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Shopping Scam Report</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="form-box">

        <h1>Online Shopping Scam</h1>

        <form id="shoppingForm">

            <input type="text" placeholder="Enter Your Name" required>

            <input type="email" placeholder="Enter Your Email" required>

            <input type="text" placeholder="Phone Number">

            <input type="text" placeholder="Shopping Website Name">

            <input type="url" placeholder="Website Link">

            <input type="number" placeholder="Amount Lost">

            <select required>
                <option value="">Select Scam Type</option>
                <option>Fake Product</option>
                <option>No Delivery</option>
                <option>Advance Payment Scam</option>
                <option>Fake Facebook Shop</option>
            </select>

            <textarea placeholder="Describe Your Problem..." rows="6"></textarea>

            <input type="file">

            <button type="submit">Submit Report</button>

        </form>

    </div>

</body>

</html>
