<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Bullying Report</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="form-box">

        <h1>Cyber Bullying</h1>

        <form id="shoppingForm">

            <input type="text" placeholder="Enter Your Name" required>

            <input type="email" placeholder="Enter Your Email" required>

            <input type="text" placeholder="Phone Number">

            <select required>
                <option value="">Select a case</option>
                <option>Blackmailing</option>
                <option>Harassment</option>
                <option>Doxxing(sharing personal info without permission)</option>
                <option>Fake profile Bullying</option>
                <option>Trolling</option>
                <option>Rumor Spreading</option>
                <option>Image/Video Shaming</option>
                <option>Hate Speech</option>
            </select>

            <textarea placeholder="Describe Your Problem..." rows="6"></textarea>

            <p style="text-align: center; color: rgb(255, 2, 2);" >Attach the file or screenshot of proof <br> </p>

            <input type="file">

            <button type="submit">Submit Report</button>

        </form>

    </div>

</body>

</html>
